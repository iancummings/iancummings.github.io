<!DOCTYPE html>
<html lang="en">
<head>
<style>
.comparison {
  position: relative;
  width: 100%;
  max-width: 800px;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  user-select: none;
}

.comparison img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  inset: 0;
}

.after {
  clip-path: inset(0 0 0 50%);
}

.divider {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 3px;
  background: white;
  transform: translateX(-50%);
  pointer-events: none;
}

.handle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  border: 2px solid #555;
  display: grid;
  place-items: center;
  font-size: 20px;
}

.comparison input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: ew-resize;
  margin: 0;
}

.label {
  position: absolute;
  top: 12px;
  padding: 6px 12px;
  background: #0009;
  color: white;
  font: 14px sans-serif;
  border-radius: 4px;
}

.before-label { left: 12px; }
.after-label { right: 12px; }
</style>
</head>
<body>

<div class="comparison" id="comparison">

  <img src="before.jpg" alt="Before processing">

  <img src="after.jpg" alt="After processing"
       class="after" id="afterImage">

  <div class="label before-label">Before</div>
  <div class="label after-label">After</div>

  <div class="divider" id="divider">
    <div class="handle">|</div>
  </div>

  <input type="range" min="0" max="100"
         value="50" id="slider"
         aria-label="Compare before and after images">

</div>

<script>
const slider = document.getElementById('slider');
const after = document.getElementById('afterImage');
const divider = document.getElementById('divider');

slider.addEventListener('input', () => {
  const value = slider.value;

  after.style.clipPath =
    `inset(0 0 0 ${value}%)`;

  divider.style.left = `${value}%`;
});
</script>

</body>
</html>
